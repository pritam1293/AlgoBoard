spring.application.name=AlgoBoard
spring.main.banner-mode=off

server.error.include-message=never
server.error.include-stacktrace=never

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Neon PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_FAIL_TIMEOUT:1}
spring.datasource.hikari.connection-timeout=30000
# Safe with Neon pooler connections (PgBouncer transaction mode)
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=${HIBERNATE_JDBC_METADATA_ACCESS:true}

# Flyway migrations (baseline existing databases at version 0)
# Set FLYWAY_ENABLED=false in .env to skip startup migrations once the schema is current.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Cache: in-memory by default; set CACHE_TYPE=redis to enable Redis
app.cache.type=${CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email verification
# The frontend URL is used to build the verification link sent by email.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.email.from=${MAIL_FROM:no-reply@algoboard.app}
app.email.verification-expiry-hours=${EMAIL_VERIFICATION_EXPIRY_HOURS:24}

# SMTP. Leave MAIL_HOST empty during local development to log verification
# links to the console instead of sending them.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}

# Keep startup logs concise
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.apache=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.algoboard=INFO
logging.pattern.console=%d{HH:mm:ss} - %msg%n
